services:
  - type: web
    name: oralabspred
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run p2_chemberta/streamlit_app.py --server.address 0.0.0.0 --server.port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.10.11"
